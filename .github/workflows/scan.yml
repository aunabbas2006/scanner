name: bounty radar

on:
  schedule:
    - cron: '*/15 * * * *'   # ponytail: GH cron drifts 5-20min under load; fine for this, use a VPS if you need real 15min
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - run: python scan.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: commit
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          git add docs/bounties.json
          git diff --staged --quiet || git commit -m "bounties $(date -u +%H:%M)"
          git push
