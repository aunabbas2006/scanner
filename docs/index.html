<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bounty Radar</title>
<style>
:root{--bg:#fbfbfa;--fg:#1a1a18;--dim:#6b6b66;--card:#fff;--line:#e6e5e1;--accent:#1a7f4b;--new:#c2410c}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--fg:#eeeeec;--dim:#9a9a94;--card:#201f1d;--line:#33322e;--accent:#4ade80;--new:#fb923c}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 ui-sans-serif,system-ui,sans-serif;padding:24px;max-width:900px;margin:auto}
h1{font-size:20px;letter-spacing:-.02em}
header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.sub{color:var(--dim);font-size:13px}
.stats{display:flex;gap:20px;margin:18px 0;flex-wrap:wrap}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
input{width:100%;padding:9px 12px;margin-bottom:14px;background:var(--card);color:var(--fg);
  border:1px solid var(--line);border-radius:7px;font:inherit}
a.row{display:flex;gap:14px;align-items:baseline;padding:12px 14px;margin-bottom:7px;background:var(--card);
  border:1px solid var(--line);border-radius:8px;text-decoration:none;color:inherit}
a.row:hover{border-color:var(--accent)}
a.row.claimed{opacity:.55}
.amt{font-weight:650;color:var(--accent);font-variant-numeric:tabular-nums;min-width:58px}
.score{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.s-hi{color:var(--accent)} .s-mid{color:#b45309} .s-lo{color:var(--dim)}
@media(prefers-color-scheme:dark){.s-mid{color:#fbbf24}}
.why{color:var(--dim);font-size:11px;display:block;margin-top:2px}
.mid{flex:1;min-width:0}
.title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{color:var(--dim);font-size:12px}
.tag{color:var(--new);font-weight:600;font-size:11px;letter-spacing:.04em}
.warn{color:var(--dim);font-size:11px}
footer{color:var(--dim);font-size:12px;margin-top:20px}
</style>

<header>
  <h1>Bounty Radar</h1>
  <div class="sub" id="updated">loading…</div>
</header>

<div class="stats">
  <div class="stat"><b id="s-open">–</b><span>open</span></div>
  <div class="stat"><b id="s-new">–</b><span>new</span></div>
  <div class="stat"><b id="s-total">–</b><span>total value</span></div>
  <div class="stat"><b id="s-worth">–</b><span>worth starting</span></div>
</div>

<input id="q" placeholder="filter by repo, title, or label…  (score = should you start it)">
<div id="list"></div>
<footer>Updated every ~15 min by GitHub Actions. Comment and get assigned before you write code.</footer>

<script>
const fmt = n => '$' + n.toLocaleString(undefined,{maximumFractionDigits:0});
const ago = iso => {
  const h = (Date.now() - new Date(iso)) / 36e5;
  return h < 1 ? Math.round(h*60)+'m' : h < 48 ? Math.round(h)+'h' : Math.round(h/24)+'d';
};
let all = [];

const render = () => {
  const q = document.getElementById('q').value.toLowerCase();
  const show = all.filter(b =>
    !q || (b.repo+' '+b.title+' '+b.labels.join(' ')).toLowerCase().includes(q));
  document.getElementById('list').innerHTML = show.map(b => {
    const fresh = (Date.now() - new Date(b.first_seen)) < 6*36e5;
    const cls = b.score >= 70 ? 's-hi' : b.score >= 45 ? 's-mid' : 's-lo';
    return `<a class="row${b.score < 45 ? ' claimed' : ''}" href="${b.url}" target="_blank" rel="noopener">
      <span class="score ${cls}" title="${(b.why||[]).join(String.fromCharCode(10))}">${b.score}</span>
      <span class="amt">${fmt(b.amount)}</span>
      <span class="mid">
        <span class="title">${b.title.replace(/</g,'&lt;')}</span>
        <span class="meta">${b.repo} · ${ago(b.updated_at || b.created_at)} since activity · ${b.comments} comments
          ${b.attempts ? `· <span class="warn">${b.attempts} attempting</span>` : ''}
          ${b.has_pr ? '· <span class="warn">PR submitted</span>' : ''}
          ${b.assigned ? '· <span class="warn">assigned</span>' : ''}</span>
        <span class="why">${(b.why||[]).join(' · ')}</span>
      </span>
      ${fresh ? '<span class="tag">NEW</span>' : ''}
    </a>`;
  }).join('') || '<p class="sub">Nothing matches.</p>';
};

fetch('bounties.json?' + Date.now()).then(r => r.json()).then(d => {
  all = d.bounties;
  document.getElementById('updated').textContent = 'updated ' + ago(d.updated) + ' ago';
  document.getElementById('s-open').textContent  = all.length;
  document.getElementById('s-new').textContent   = d.new_count;
  document.getElementById('s-total').textContent = fmt(all.reduce((s,b) => s+b.amount, 0));
  document.getElementById('s-worth').textContent = all.filter(b => b.score >= 70).length;
  render();
}).catch(() => document.getElementById('updated').textContent = 'no data yet — run the workflow once');

document.getElementById('q').addEventListener('input', render);
</script>
